[package]
name = "xrpl-watch"
version = "0.1.0"
edition = "2021"
description = "Terminal dashboard for the live validator: who writes the ledger database, the signing gate, the Rust engine, the C++ comparison copy, the upstream feed and consensus."
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/ilubxrp589/xrpl-watch"

# Its own workspace, so it builds the same inside or outside another Cargo workspace.
[workspace]

[dependencies]
ratatui = "0.30"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
strip = true
